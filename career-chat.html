<div id="chatMessages" class="chat-messages">

    <div class="ai-message">
        Hello! &#128075; I am Career DNA AI.
        <br><br>
        Ask me anything about careers, skills, internships,
        placements, jobs, AI/ML, Java, Python and more.

            id="sendButton"
            onclick="askCareerAI()">
