<!DOCTYPE html>
<html>

<head>

    <title>Career DNA AI Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">

</head>


<body>


<div class="ai-bg"></div>



<header>

    <div class="logo">
        &#129302; Career DNA AI
    </div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a onclick="logout()">
            Logout
        </a>

    </nav>

</header>





<div class="dashboard-container">


    <div class="welcome-card">


        <div class="robot">
            &#129302;
        </div>


        <h1>
            Welcome,
            <span id="studentName"></span>
        </h1>


        <p>
            Your AI career assistant is ready to discover your future path.
        </p>



    </div>





    <div class="feature-grid">



        <div class="feature-card">

            <div>
                &#129504;
            </div>

            <h2>
                AI Career Test
            </h2>

            <p>
                Analyze your skills and interests using AI.
            </p>


            <button onclick="startTest()">

                Start Assessment

            </button>


        </div>





        <div class="feature-card">


            <div>
                &#127942;
            </div>


            <h2>
                Career Result
            </h2>


            <p>
                View your AI generated recommendation.
            </p>


            <button onclick="viewResult()">

                View Result

            </button>


        </div>





        <div class="feature-card">


            <div>
                &#128200;
            </div>


            <h2>
                Career Insights
            </h2>


            <p>
                Understand your strengths.
            </p>


        </div>



    </div>


</div>




<script src="js/dashboard.js"></script>


</body>

</html>
