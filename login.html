<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career DNA AI Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="ai-background"></div>



<div class="ai-login-card">


    <div class="ai-logo">
        🤖
    </div>


    <h1>
        Career DNA AI
    </h1>


    <p class="tagline">
        Discover your perfect career path using Artificial Intelligence
    </p>




    <!-- Login Role Selection -->

    <div class="ai-role">


        <h3>
            Continue As
        </h3>



        <div class="role-container">



            <!-- Student -->

            <label class="ai-role-card">


                <input
                        type="radio"
                        name="role"
                        value="STUDENT"
                        checked>


                <div class="role-inner">


                    <div class="role-icon">
                        🎓
                    </div>


                    <h4>
                        Student
                    </h4>


                    <p>
                        AI Career Assessment
                    </p>


                </div>


            </label>





            <!-- Admin -->

            <label class="ai-role-card">


                <input
                        type="radio"
                        name="role"
                        value="ADMIN">


                <div class="role-inner">


                    <div class="role-icon">
                        👨‍💼
                    </div>


                    <h4>
                        Admin
                    </h4>


                    <p>
                        Manage AI System
                    </p>


                </div>


            </label>



        </div>


    </div>





    <input
            type="email"
            id="email"
            placeholder="📧 Enter Email">





    <input
            type="password"
            id="password"
            placeholder="🔐 Enter Password">





    <button onclick="login()">

        🚀 Login to AI Portal

    </button>





    <p class="register">

        New User?

        <a href="register.html">
            Create Account
        </a>

    </p>



</div>





<script src="js/login.js"></script>



</body>

</html>
