<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career DNA AI | View Questions</title>

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="ai-bg"></div>

<header>

    <div class="logo">
        &#129302; Career DNA AI
    </div>

    <nav>

            Dashboard
        </a>

        <a href="admin.html">
            Add Question
        </a>

        <a onclick="logout()">
            Logout
        </a>

                id="searchBox"
